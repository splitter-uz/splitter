<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 445" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="fwslate" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .hdr{font-size:20px;font-weight:700;letter-spacing:.03em}
      .sub{font-size:12px;fill:#64748b}
      .card-t{font-size:12.5px;font-weight:700;fill:#0f172a;font-family:ui-monospace,Menlo,monospace}
      .card-s{font-size:11px;fill:#64748b;font-family:ui-monospace,Menlo,monospace}
      .card-n{font-size:10.5px;fill:#94a3b8}
      .badge{font-size:10px;font-weight:700;letter-spacing:.03em}
      .reg-t{font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
      .reg-s{font-size:11.5px}
      .flow{font-size:11px;fill:#475569;font-weight:600}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="445" fill="#ffffff"/>

  <!-- header -->
  <text x="590" y="34" class="hdr" fill="#0f172a" text-anchor="middle">PER-INTERFACE IPTABLES · SECURITY-GROUP MODEL</text>
  <text x="590" y="54" class="sub" text-anchor="middle">Example: eth0's inbound chain (SFW-IN-eth0) — evaluated top to bottom, first match wins</text>

  <!-- ===== pipeline: 6 boxes ===== -->
  <!-- box 0: established/related (always) -->
  <rect x="30" y="90" width="170" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="45" y="114" class="card-t">ESTABLISHED</text>
  <text x="45" y="129" class="card-t">/RELATED</text>
  <text x="45" y="148" class="card-n">always first</text>
  <rect x="45" y="158" width="60" height="18" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="75" y="171" class="badge" fill="#047857" text-anchor="middle">ACCEPT</text>

  <!-- box 1: dashboard port (always) -->
  <rect x="220" y="90" width="170" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="235" y="114" class="card-t">tcp :8088</text>
  <text x="235" y="129" class="card-t">(dashboard UI)</text>
  <text x="235" y="148" class="card-n">always — can't lock</text>
  <text x="235" y="160" class="card-n">yourself out</text>
  <rect x="235" y="164" width="60" height="18" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="265" y="177" class="badge" fill="#047857" text-anchor="middle">ACCEPT</text>

  <!-- box 2: user rule (allow ssh from office) -->
  <rect x="410" y="90" width="170" height="100" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="425" y="114" class="card-t">pri 10 · tcp/22</text>
  <text x="425" y="129" class="card-s">203.0.113.0/24</text>
  <text x="425" y="148" class="card-n">office VPN — SSH</text>
  <rect x="425" y="158" width="60" height="18" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="455" y="171" class="badge" fill="#047857" text-anchor="middle">ACCEPT</text>

  <!-- box 3: user rule (allow https) -->
  <rect x="600" y="90" width="170" height="100" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="615" y="114" class="card-t">pri 20 · tcp/443</text>
  <text x="615" y="129" class="card-s">anywhere</text>
  <text x="615" y="148" class="card-n">public HTTPS</text>
  <rect x="615" y="158" width="60" height="18" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="645" y="171" class="badge" fill="#047857" text-anchor="middle">ACCEPT</text>

  <!-- box 4: user rule (drop telnet) -->
  <rect x="790" y="90" width="170" height="100" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="805" y="114" class="card-t">pri 90 · tcp/23</text>
  <text x="805" y="129" class="card-s">anywhere</text>
  <text x="805" y="148" class="card-n">block legacy telnet</text>
  <rect x="805" y="158" width="52" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="831" y="171" class="badge" fill="#475569" text-anchor="middle">DROP</text>

  <!-- box 5: fallback = interface default policy -->
  <rect x="980" y="90" width="170" height="100" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="995" y="114" class="card-t" fill="#7c2d12">no rule matched</text>
  <text x="995" y="129" class="card-s" fill="#9a3412">→ inbound_policy</text>
  <text x="995" y="148" class="card-n" fill="#c2410c">interface default</text>
  <rect x="995" y="158" width="96" height="18" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1043" y="171" class="badge" fill="#9a3412" text-anchor="middle">ACCEPT or DROP</text>

  <!-- connectors -->
  <path d="M200,140 L220,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#fwslate)"/>
  <path d="M390,140 L410,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#fwslate)"/>
  <path d="M580,140 L600,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#fwslate)"/>
  <path d="M770,140 L790,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#fwslate)"/>
  <path d="M960,140 L980,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#fwslate)"/>

  <text x="590" y="212" class="flow" text-anchor="middle">first match wins — a rule only needs "Enabled" checked to apply; disabled rules are skipped</text>

  <!-- ===== info panels ===== -->
  <rect x="30" y="238" width="550" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="264" class="reg-t" fill="#1e3a8a">Master switch — off by default</text>
  <text x="48" y="286" class="reg-s" fill="#1d4ed8">Nothing is installed on the host until BOTH the global</text>
  <text x="48" y="304" class="reg-s" fill="#1d4ed8">"firewall_enabled" switch AND the interface's own</text>
  <text x="48" y="322" class="reg-s" fill="#1d4ed8">"enforce" toggle are on — installing the feature changes</text>
  <text x="48" y="340" class="reg-s" fill="#1d4ed8">nothing until an admin explicitly opts in.</text>

  <rect x="600" y="238" width="550" height="118" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="618" y="264" class="reg-t" fill="#991b1b">Panic button — one-click rollback</text>
  <text x="618" y="286" class="reg-s" fill="#b91c1c">Tears down every SFW-IN-*/SFW-OUT-* chain and jump rule</text>
  <text x="618" y="304" class="reg-s" fill="#b91c1c">on every interface, and flips the master switch off — in one</text>
  <text x="618" y="322" class="reg-s" fill="#b91c1c">call. Saved rules aren't deleted, so re-enabling re-applies</text>
  <text x="618" y="340" class="reg-s" fill="#b91c1c">exactly what was configured before.</text>

  <!-- footer -->
  <text x="590" y="400" font-size="12" fill="#64748b" text-anchor="middle">
    Every interface gets its own SFW-IN-&lt;iface&gt; / SFW-OUT-&lt;iface&gt; pair — eth0, eth1, mv-web-0 …
  </text>
  <text x="590" y="420" font-size="12" fill="#64748b" text-anchor="middle">
    each enforces independently, like a security group per NIC. Outbound (SFW-OUT-&lt;iface&gt;) works the same way, defaulting to accept.
  </text>
</svg>
