<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="split" x1="30" y1="32" x2="58" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- single inbound stream -->
  <path d="M4 32 H13" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>

  <!-- proxy node: open ring (gap on the right, where the traffic splits out) -->
  <path d="M30 27 A9 9 0 1 0 30 37" stroke="#0f766e" stroke-width="5"
        stroke-linecap="round"/>

  <!-- the split: one stream fans out to three backends -->
  <g stroke="url(#split)" stroke-width="5" stroke-linecap="round">
    <path d="M33 32 L54 13"/>
    <path d="M33 32 H55"/>
    <path d="M33 32 L54 51"/>
  </g>
  <g fill="#34d399">
    <circle cx="56" cy="11" r="3.5"/>
    <circle cx="58" cy="32" r="3.5"/>
    <circle cx="56" cy="53" r="3.5"/>
  </g>
</svg>
