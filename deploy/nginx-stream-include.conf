# --------------------------------------------------------------------------
# Add this block to /etc/nginx/nginx.conf at the TOP LEVEL (a sibling of the
# existing `http {}` block — NOT inside it). It wires the stream.d directory
# that Splitter writes into.
#
# The stream {} context is provided by the ngx_stream_core_module. On most
# distros it is built in; on others install `nginx-module-stream` and add
#   load_module modules/ngx_stream_module.so;
# at the very top of nginx.conf.
# --------------------------------------------------------------------------
stream {
    # TLS termination (ssl_certificate / proxy_ssl) is part of stream core in
    # modern nginx; the stream SSL module ships with the stream module package.
    include /etc/nginx/stream.d/*.conf;
}
